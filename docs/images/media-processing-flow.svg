<text x="1318" y="337" font-size="19" font-weight="600" fill="#1D2433" text-anchor="start">Self-check</text>
<text x="1318" y="362" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start" font-family="Menlo, SFMono-Regular, Consolas, monospace">media-verify</text>
<text x="1318" y="384" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">cuts, duration, grade, pops</text>
<path d="M1248,354 L1296,354" fill="none" stroke="#98A2B3" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1300" y="468" width="264" height="92" rx="10" fill="#F7F8FA" stroke="#D0D5DD" stroke-width="1.2"/>
