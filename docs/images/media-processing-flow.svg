<line x1="686" y1="238" x2="914" y2="238" stroke="#D0D5DD"/>
<text x="686" y="262" font-size="17" font-weight="600" fill="#1D2433" text-anchor="start">Inventory and analysis notes</text>
<text x="686" y="286" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">what the footage contains</text>
<line x1="686" y1="336" x2="914" y2="336" stroke="#D0D5DD"/>
<text x="686" y="360" font-size="17" font-weight="600" fill="#1D2433" text-anchor="start">Shot list and storyboard</text>
<text x="686" y="384" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">strongest clips, sequence</text>
<line x1="686" y1="434" x2="914" y2="434" stroke="#D0D5DD"/>
<text x="686" y="458" font-size="17" font-weight="600" fill="#1D2433" text-anchor="start">EDL or rough-cut spec</text>
<text x="686" y="482" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">edl.json: ranges, overlays</text>
