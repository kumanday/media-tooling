<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Media processing flow</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#98A2B3"/></marker></defs>
<rect x="0.5" y="0.5" width="1599" height="799" rx="18" fill="#FFFFFF" stroke="#D0D5DD"/>
<text x="36" y="48" font-size="24" font-weight="700" fill="#1D2433" text-anchor="start">Media processing flow</text>
<text x="36" y="74" font-size="17" font-weight="400" fill="#5B6475" text-anchor="start">From raw recordings to a checked, finished video. Your agent runs the commands; you review the plan and the cut.</text>
<text x="36" y="128" font-size="15" font-weight="700" fill="#64748B" text-anchor="start">1  SOURCE MEDIA</text>
<text x="352" y="128" font-size="15" font-weight="700" fill="#2F6FEB" text-anchor="start">2  PROCESS</text>
<text x="668" y="128" font-size="15" font-weight="700" fill="#7C4DDB" text-anchor="start">3  PLAN</text>
<text x="984" y="128" font-size="15" font-weight="700" fill="#0E9384" text-anchor="start">4  ASSEMBLE</text>
<text x="1300" y="128" font-size="15" font-weight="700" fill="#2E9E48" text-anchor="start">5  CHECK AND DELIVER</text>
