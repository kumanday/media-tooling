<text x="1318" y="522" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start" font-family="Menlo, SFMono-Regular, Consolas, monospace">renders/&lt;name&gt;.mp4</text>
<text x="1318" y="544" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">or FCPXML for Resolve</text>
