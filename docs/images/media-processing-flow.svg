<rect x="352" y="198" width="4" height="72" rx="2" fill="#2F6FEB"/>
<text x="370" y="217" font-size="19" font-weight="600" fill="#1D2433" text-anchor="start">Transcripts and subtitles</text>
<text x="370" y="242" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start" font-family="Menlo, SFMono-Regular, Consolas, monospace">media-subtitle</text>
<text x="370" y="264" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start" font-family="Menlo, SFMono-Regular, Consolas, monospace">media-pack-transcript</text>
<path d="M300,223.0 L348,223.0" fill="none" stroke="#98A2B3" stroke-width="1.6" marker-end="url(#arrow)"/>
