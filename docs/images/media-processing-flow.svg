<text x="54" y="457" font-size="19" font-weight="600" fill="#1D2433" text-anchor="start">Screenshots and stills</text>
<text x="54" y="482" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">slides, photos, captures</text>
<rect x="352" y="428" width="264" height="70" rx="10" fill="#F7F8FA" stroke="#D0D5DD" stroke-width="1.2"/>
<rect x="352" y="438" width="4" height="50" rx="2" fill="#2F6FEB"/>
<text x="370" y="457" font-size="19" font-weight="600" fill="#1D2433" text-anchor="start">Indexed stills</text>
<text x="370" y="482" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">inventory, by the ingest skill</text>
