<rect x="984" y="318" width="4" height="94" rx="2" fill="#0E9384"/>
<text x="1002" y="337" font-size="19" font-weight="600" fill="#1D2433" text-anchor="start">Edited render</text>
<text x="1002" y="362" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start" font-family="Menlo, SFMono-Regular, Consolas, monospace">media-edl-render</text>
<text x="1002" y="384" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">grade, fades, loudness,</text>
<text x="1002" y="406" font-size="16" font-weight="400" fill="#5B6475" text-anchor="start">overlays, subtitles</text>
